services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: athleteos
      POSTGRES_USER: athleteos
      POSTGRES_PASSWORD: athleteos
    ports:
      - "5432:5432"
    volumes:
      - athleteos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athleteos -d athleteos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://athleteos:athleteos@postgres:5432/athleteos
      REDIS_URL: redis://redis:6379/0
      WEB_ORIGIN: http://localhost:3000
      SESSION_SECRET: local-compose-secret-change-before-deploy
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  athleteos_postgres:

